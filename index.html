<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Ron!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Permanent+Marker&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Creepster', cursive;
            overflow: hidden;
        }
        
        .sparkles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: sparkle 2s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        
        .cake-container {
            position: relative;
            animation: bounce 1s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .cake {
            position: relative;
            width: 400px;
            height: 300px;
        }
        
        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 450px;
            height: 30px;
            background: linear-gradient(to bottom, #f5f5f5, #ddd);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .layer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 10px;
            box-shadow: inset -10px -10px 30px rgba(0,0,0,0.3), 0 10px 20px rgba(0,0,0,0.4);
        }
        
        .layer-bottom {
            bottom: 25px;
            width: 380px;
            height: 120px;
            background: linear-gradient(to bottom, #ff69b4, #ff1493);
            border-radius: 10px 10px 20px 20px;
        }
        
        .layer-middle {
            bottom: 145px;
            width: 320px;
            height: 100px;
            background: linear-gradient(to bottom, #9370db, #8a2be2);
            border-radius: 10px 10px 15px 15px;
        }
        
        .layer-top {
            bottom: 245px;
            width: 260px;
            height: 80px;
            background: linear-gradient(to bottom, #ff6b6b, #ee5a5a);
            border-radius: 10px 10px 10px 10px;
        }
        
        .frosting {
            position: absolute;
            width: 100%;
            height: 25px;
            background: linear-gradient(to bottom, #fff, #f0f0f0);
            border-radius: 0 0 10px 10px;
        }
        
        .layer-bottom .frosting { top: 0; }
        .layer-middle .frosting { top: 0; }
        .layer-top .frosting { top: 0; }
        
        .drip {
            position: absolute;
            background: linear-gradient(to bottom, #fff, #f0f0f0);
            border-radius: 0 0 50% 50%;
        }
        
        .candles {
            position: absolute;
            bottom: 320px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
        }
        
        .candle {
            width: 15px;
            height: 60px;
            background: linear-gradient(to right, #ff69b4, #ff1493, #ff69b4);
            border-radius: 3px 3px 0 0;
            position: relative;
        }
        
        .wick {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 15px;
            background: #333;
        }
        
        .flame {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: linear-gradient(to top, #ff4500, #ff6b00, #ffd700);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.3s ease-in-out infinite alternate;
            box-shadow: 
                0 0 10px #ff6b00,
                0 0 20px #ff4500,
                0 0 30px #ff6b00,
                0 0 40px #ffd700;
        }
        
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
            100% { transform: translateX(-50%) scale(1.1, 0.9) rotate(2deg); opacity: 0.9; }
        }
        
        .flame::before {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 25px;
            background: linear-gradient(to top, #fff, #ffd700);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: innerFlicker 0.2s ease-in-out infinite alternate;
        }
        
        @keyframes innerFlicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(0.8); }
        }
        
        .glow {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,107,0,0.4) 0%, transparent 70%);
            animation: glow 0.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            0% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            100% { opacity: 1; transform: translateX(-50%) scale(1.2); }
        }
        
        .message {
            margin-top: 50px;
            font-size: 4rem;
            color: #ff1493;
            text-shadow: 
                3px 3px 0 #fff,
                -3px -3px 0 #fff,
                3px -3px 0 #fff,
                -3px 3px 0 #fff,
                0 0 30px #ff1493,
                0 0 60px #ff1493;
            animation: pulse 0.5s ease-in-out infinite alternate;
            text-align: center;
            letter-spacing: 5px;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        .subtitle {
            margin-top: 20px;
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            animation: flash 1s ease-in-out infinite;
        }
        
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: fall linear infinite;
        }
        
        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="sparkles" id="sparkles"></div>
    
    <div class="cake-container">
        <div class="candles">
            <div class="candle">
                <div class="glow"></div>
                <div class="flame"></div>
                <div class="wick"></div>
            </div>
            <div class="candle">
                <div class="glow"></div>
                <div class="flame"></div>
                <div class="wick"></div>
            </div>
            <div class="candle">
                <div class="glow"></div>
                <div class="flame"></div>
                <div class="wick"></div>
            </div>
            <div class="candle">
                <div class="glow"></div>
                <div class="flame"></div>
                <div class="wick"></div>
            </div>
            <div class="candle">
                <div class="glow"></div>
                <div class="flame"></div>
                <div class="wick"></div>
            </div>
        </div>
        
        <div class="cake">
            <div class="plate"></div>
            <div class="layer layer-bottom">
                <div class="frosting"></div>
            </div>
            <div class="layer layer-middle">
                <div class="frosting"></div>
            </div>
            <div class="layer layer-top">
                <div class="frosting"></div>
            </div>
        </div>
    </div>
    
    <div class="message">FUCK YOU RON</div>
    <div class="subtitle">🎂 Happy Birthday! 🎂</div>
    
    <script>
        // Create sparkles
        const sparklesContainer = document.getElementById('sparkles');
        for (let i = 0; i < 50; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            sparkle.style.animationDelay = Math.random() * 2 + 's';
            sparkle.style.background = ['#ff69b4', '#ffd700', '#ff6b6b', '#fff'][Math.floor(Math.random() * 4)];
            sparklesContainer.appendChild(sparkle);
        }
        
        // Create confetti
        for (let i = 0; i < 100; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + '%';
            confetti.style.background = ['#ff69b4', '#ffd700', '#ff6b6b', '#9370db', '#00ff00'][Math.floor(Math.random() * 5)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(confetti);
        }
        
        // Play birthday music (using Web Audio API for simple beep)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playNote(freq, duration, delay) {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            }, delay);
        }
        
        // Happy Birthday tune
        const notes = [264, 264, 297, 264, 352, 330, 0, 264, 264, 297, 264, 396, 352, 0, 264, 264, 528, 440, 352, 330, 297, 0, 466, 466, 440, 352, 396, 352];
        const durations = [0.3, 0.3, 0.6, 0.6, 0.6, 0.9, 0.3, 0.3, 0.3, 0.3, 0.6, 0.6, 0.9, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3, 0.3, 0.9, 0.3, 0.3, 0.3, 0.3, 0.3, 0.6, 0.9];
        let delay = 0;
        notes.forEach((note, i) => {
            if (note > 0) playNote(note, durations[i], delay * 1000);
            delay += durations[i];
        });
    </script>
</body>
</html>
