<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUCK YOU RON</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .text-container {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: float 4s ease-in-out infinite;
        }

        .text-container h1 {
            font-size: clamp(4rem, 15vw, 14rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1;
            color: #fff;
            text-shadow:
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 80px #ff0000,
                0 0 120px #ff0000,
                0 0 160px #ff0000;
            animation: flicker 3s infinite alternate;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes flicker {
            0%, 18%, 22%, 25%, 53%, 57%, 100% {
                text-shadow:
                    0 0 10px #ff0000,
                    0 0 20px #ff0000,
                    0 0 40px #ff0000,
                    0 0 80px #ff0000,
                    0 0 120px #ff0000,
                    0 0 160px #ff0000;
                opacity: 1;
            }
            20%, 24%, 55% {
                text-shadow:
                    0 0 5px #ff0000,
                    0 0 10px #ff0000;
                opacity: 0.85;
            }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: #ff0000;
            border-radius: 50%;
            opacity: 0.4;
            animation: drift linear infinite;
        }

        @keyframes drift {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="text-container">
        <h1>FUCK YOU RON</h1>
    </div>

    <script>
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 6 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 6 + 4) + 's';
            p.style.animationDelay = Math.random() * 8 + 's';
            p.style.background = ['#ff0000', '#ff3333', '#ff6666', '#ff9999'][Math.floor(Math.random() * 4)];
            container.appendChild(p);
        }
    </script>
</body>
</html>
